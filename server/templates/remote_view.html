<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 원격 제어 - {{ client_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #viewport-wrapper {
            position: absolute;
            transform-origin: 0 0;
            user-select: none;
            -webkit-user-select: none;
            background: #000;
        }

        #stream-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 터치 피드백 마커 */
        .touch-hit-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #38bdf8;
            border: 2px solid #ffffff;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: fade-out 1.2s forwards;
            z-index: 50;
        }
        @keyframes fade-out {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none bg-black">
    <!-- 상단 툴바 -->
    <div class="h-[50px] bg-slate-900 border-b border-slate-800 flex items-center justify-between px-2 sm:px-4 text-xs text-white z-20 shrink-0">
        <div class="font-bold flex items-center gap-1.5 sm:gap-2">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full {{ 'bg-emerald-500 animate-pulse' if is_online else 'bg-rose-500' }}"></span>
            <div class="flex flex-col sm:flex-row sm:items-center sm:gap-2">
                <span class="text-xs sm:text-sm font-extrabold text-white truncate max-w-[120px] sm:max-w-none">{{ client_name }} ({{ client_id }})</span>
                <span class="text-[10px] text-sky-400 font-mono bg-sky-950 px-1.5 py-0.5 rounded border border-sky-800/40">IP: {{ client_ip if client_ip else '미확인' }}</span>
            </div>
        </div>

        <div class="flex items-center gap-1 sm:gap-2">
            <!-- 윈도우 기본 RDP 연결 파일 -->
            <a href="/api/rdp/{{ client_id }}" download class="px-2 sm:px-2.5 py-1.5 bg-sky-800 hover:bg-sky-700 rounded font-bold transition flex items-center gap-1 text-[11px] text-white border border-sky-600/40" title="윈도우 기본 원격 데스크톱(mstsc) 연결 파일 다운로드">
                <i class="fa-solid fa-desktop"></i> <span class="hidden md:inline">MSTSC</span>
            </a>

            <!-- 화면 크기 초기화 -->
            <button onclick="resetZoom()" class="px-2 py-1.5 bg-slate-700 hover:bg-slate-600 rounded font-semibold transition flex items-center gap-1" title="화면 크기 맞춤">
                <i class="fa-solid fa-expand"></i>
            </button>

            <!-- 키보드 텍스트 전송 -->
            <input id="key-input" type="text" placeholder="입력 후 전송" class="bg-slate-950 border border-slate-700 px-2 py-1.5 rounded text-xs text-white w-20 sm:w-36 focus:outline-none focus:border-indigo-500">
            <button onclick="sendKeyText()" class="px-2 sm:px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded font-bold transition flex items-center gap-1">
                <i class="fa-solid fa-paper-plane"></i>
            </button>

            <!-- 닫기 -->
            <button onclick="window.close()" class="px-2 sm:px-3 py-1.5 bg-rose-800 hover:bg-rose-700 rounded font-semibold transition">
                닫기
            </button>
        </div>
    </div>

    <!-- 메인 터치/화면 컨테이너 -->
    <div id="touch-container" class="flex-1 relative bg-black overflow-hidden w-full h-full touch-none select-none">
        
        <!-- 로딩 / 오프라인 인디케이터 -->
        <div id="loading-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/95 text-slate-300 gap-3 z-30">
            {% if not is_online %}
            <div class="w-12 h-12 rounded-full bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 text-2xl">
                <i class="fa-solid fa-power-off"></i>
            </div>
            <p class="text-base font-bold text-white">{{ client_name }} PC가 오프라인 상태입니다</p>
            <p class="text-xs text-slate-400 max-w-sm text-center">PC에서 ZeusClientAgent가 구동 중인지 확인해주세요.</p>
            <button onclick="location.reload()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-bold text-white transition">
                다시 연결 시도
            </button>
            {% else %}
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500"></i>
            <p class="text-sm font-bold text-white">{{ client_name }} ({{ client_ip }}) 화면을 불러오는 중...</p>
            {% endif %}
        </div>

        <!-- 줌/팬 적용 대상 래퍼 (1:1 정밀 좌표 표준 동기화) -->
        <div id="viewport-wrapper">
            <img id="stream-img" src="" alt="Remote Desktop" class="opacity-0 transition-opacity">
        </div>
    </div>

    <script>
        const clientId = "{{ client_id }}";
        const actualClientId = "{{ actual_client_id }}" || clientId;
        const targetId = actualClientId;
        
        const container = document.getElementById('touch-container');
        const wrapper = document.getElementById('viewport-wrapper');
        const img = document.getElementById('stream-img');
        const overlay = document.getElementById('loading-overlay');
        const statusDot = document.getElementById('status-dot');

        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${location.host}/ws/remote_view/${targetId}`);

        let firstFrameReceived = false;
        let imgNaturalW = 1920;
        let imgNaturalH = 1080;

        let scale = 1.0;
        let panX = 0;
        let panY = 0;
        let baseScale = 1.0;

        function updateTransform() {
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function fitToContainer() {
            if (!imgNaturalW || !imgNaturalH) return;
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            if (cw === 0 || ch === 0) return;

            const scaleX = cw / imgNaturalW;
            const scaleY = ch / imgNaturalH;
            baseScale = Math.min(scaleX, scaleY);
            scale = baseScale;

            const renderedW = imgNaturalW * baseScale;
            const renderedH = imgNaturalH * baseScale;
            panX = (cw - renderedW) / 2;
            panY = (ch - renderedH) / 2;

            wrapper.style.width = `${imgNaturalW}px`;
            wrapper.style.height = `${imgNaturalH}px`;

            updateTransform();
        }

        window.resetZoom = fitToContainer;
        window.addEventListener('resize', fitToContainer);

        ws.onopen = () => { console.log('[Remote] Connected'); };
        ws.onmessage = (e) => {
            if (!firstFrameReceived) {
                firstFrameReceived = true;
                if (overlay) overlay.style.display = 'none';
                img.classList.remove('opacity-0');
            }
            try {
                if (e.data.startsWith('{')) {
                    const parsed = JSON.parse(e.data);
                    img.src = "data:image/jpeg;base64," + (parsed.image || parsed.frame || "");
                } else {
                    img.src = "data:image/jpeg;base64," + e.data;
                }
            } catch (err) {
                img.src = "data:image/jpeg;base64," + e.data;
            }
        };

        img.onload = () => {
            if (img.naturalWidth && (imgNaturalW !== img.naturalWidth || imgNaturalH !== img.naturalHeight)) {
                imgNaturalW = img.naturalWidth;
                imgNaturalH = img.naturalHeight;
                fitToContainer();
            }
        };

        ws.onerror = () => { if (statusDot) statusDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500'; };
        ws.onclose = () => { if (statusDot) statusDot.className = 'w-2.5 h-2.5 rounded-full bg-slate-600'; };

        function sendEvent(type, xRatio, yRatio, extra = {}) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ event: type, x: xRatio, y: yRatio, ...extra }));
            }
        }

        // 🌟 표준 1:1 정밀 좌표 공식 (모바일 상단바/뷰포트 오프셋 완벽 감산)
        function screenToImageRatio(clientX, clientY) {
            const cRect = container.getBoundingClientRect();
            const relX = clientX - cRect.left;
            const relY = clientY - cRect.top;

            const imgX = (relX - panX) / scale;
            const imgY = (relY - panY) / scale;

            if (imgX >= 0 && imgX <= imgNaturalW && imgY >= 0 && imgY <= imgNaturalH) {
                const xRatio = Math.max(0, Math.min(1, imgX / imgNaturalW));
                const yRatio = Math.max(0, Math.min(1, imgY / imgNaturalH));
                return { x: xRatio, y: yRatio, imgX, imgY, valid: true };
            }
            return { valid: false, imgX, imgY };
        }

        function showHitMarker(imgX, imgY) {
            const marker = document.createElement('div');
            marker.className = 'touch-hit-marker';
            marker.style.left = `${imgX}px`;
            marker.style.top = `${imgY}px`;
            wrapper.appendChild(marker);
            setTimeout(() => marker.remove(), 1200);
        }

        // --- 터치 및 마우스 조작 인터랙션 ---
        let isTouching = false;
        let startX = 0, startY = 0;
        let startPanX = 0, startPanY = 0;
        let initialPinchDist = 0;
        let pinchCenterImgX = 0;
        let pinchCenterImgY = 0;
        let touchStartTime = 0;
        let movedSignificantly = false;
        let lastTouchEndTime = 0;

        container.addEventListener('touchstart', (e) => {
            touchStartTime = Date.now();
            if (e.touches.length === 1) {
                isTouching = true;
                movedSignificantly = false;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startPanX = panX;
                startPanY = panY;
            } else if (e.touches.length === 2) {
                isTouching = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );

                // 두 손가락의 중심점(Focal Point)을 뷰포트 기준 상대 좌표로 계산
                const cRect = container.getBoundingClientRect();
                const midClientX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midClientY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const relX = midClientX - cRect.left;
                const relY = midClientY - cRect.top;

                // 줌이 커지더라도 이 이미지 픽셀 위치가 두 손가락 중심에 고정되도록 기준점 저장
                pinchCenterImgX = (relX - panX) / scale;
                pinchCenterImgY = (relY - panY) / scale;
            }
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isTouching) {
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                    movedSignificantly = true;
                }

                if (scale > baseScale * 1.05 && movedSignificantly) {
                    e.preventDefault();
                    panX = startPanX + dx;
                    panY = startPanY + dy;
                    updateTransform();
                } else if (!movedSignificantly) {
                    const pos = screenToImageRatio(e.touches[0].clientX, e.touches[0].clientY);
                    if (pos.valid) {
                        sendEvent('MOVE', pos.x, pos.y);
                    }
                }
            } else if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (initialPinchDist > 0) {
                    const factor = dist / initialPinchDist;
                    initialPinchDist = dist; // 연속적인 줌 비율 계산

                    const newScale = Math.min(Math.max(baseScale * 0.8, scale * factor), baseScale * 6.0);

                    // 두 손가락의 실시간 중심점
                    const cRect = container.getBoundingClientRect();
                    const midClientX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midClientY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const relX = midClientX - cRect.left;
                    const relY = midClientY - cRect.top;

                    // 🌟 핵심: 두 손가락 중심점이 확대된 후에도 손가락 사이에 그대로 머물도록 panX, panY 동시 보정
                    panX = relX - pinchCenterImgX * newScale;
                    panY = relY - pinchCenterImgY * newScale;
                    scale = newScale;

                    // 다음 프레임을 위한 기준점 갱신
                    pinchCenterImgX = (relX - panX) / scale;
                    pinchCenterImgY = (relY - panY) / scale;

                    updateTransform();
                }
            }
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            const touchDuration = Date.now() - touchStartTime;
            if (!movedSignificantly && e.changedTouches.length === 1 && touchDuration < 600) {
                const clientX = e.changedTouches[0].clientX;
                const clientY = e.changedTouches[0].clientY;
                const pos = screenToImageRatio(clientX, clientY);

                if (pos.valid) {
                    showHitMarker(pos.imgX, pos.imgY);
                    lastTouchEndTime = Date.now();
                    sendEvent('CLICK', pos.x, pos.y, { button: 'left' });
                }
            }
            isTouching = false;
        });

        // 데스크톱 마우스 클릭 지원 (터치 후 가상 클릭 중복 방지)
        container.addEventListener('click', (e) => {
            if (e.ctrlKey) return;
            if (Date.now() - lastTouchEndTime < 400) return;

            const pos = screenToImageRatio(e.clientX, e.clientY);
            if (pos.valid) {
                showHitMarker(pos.imgX, pos.imgY);
                sendEvent('CLICK', pos.x, pos.y, { button: 'left' });
            }
        });

        // 데스크톱 마우스 휠 줌 (커서 위치를 중심으로 확대/축소)
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.ctrlKey) {
                const factor = e.deltaY < 0 ? 1.15 : 0.85;
                const newScale = Math.min(Math.max(baseScale * 0.8, scale * factor), baseScale * 6.0);

                const cRect = container.getBoundingClientRect();
                const relX = e.clientX - cRect.left;
                const relY = e.clientY - cRect.top;

                const cursorImgX = (relX - panX) / scale;
                const cursorImgY = (relY - panY) / scale;

                panX = relX - cursorImgX * newScale;
                panY = relY - cursorImgY * newScale;
                scale = newScale;

                updateTransform();
            } else {
                const delta = e.deltaY < 0 ? 120 : -120;
                sendEvent('WHEEL', 0, 0, { delta: delta });
            }
        }, { passive: false });

        // 키보드 텍스트 전송
        window.sendKeyText = function() {
            const input = document.getElementById('key-input');
            if (input.value) {
                sendEvent('TEXT', 0, 0, { text: input.value });
                input.value = '';
            }
        };
        document.getElementById('key-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendKeyText();
        });

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(fitToContainer, 50);
        });
    </script>
</body>
</html>
