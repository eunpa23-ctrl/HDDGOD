<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 원격 제어 - {{ client_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #viewport-wrapper {
            position: absolute;
            transform-origin: 0 0;
            user-select: none;
            -webkit-user-select: none;
            background: #000;
        }

        #stream-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 터치 피드백 마커 (좌클릭: 하늘색, 우클릭: 황금주황색) */
        .touch-hit-marker {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #38bdf8;
            border: 2px solid #ffffff;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: fade-out 1.2s forwards;
            z-index: 50;
        }
        .touch-hit-marker.right-click {
            background: #f59e0b;
            border-color: #fef3c7;
            box-shadow: 0 0 12px #f59e0b;
            width: 18px;
            height: 18px;
        }
        @keyframes fade-out {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
        }
    </style>
</head>
<body class="flex flex-col h-screen w-full max-w-full overflow-hidden select-none bg-black">
    <!-- 상단 툴바 -->
    <div class="h-[50px] w-full max-w-full bg-slate-900 border-b border-slate-800 flex items-center justify-between px-2 sm:px-4 text-xs text-white z-20 shrink-0">
        <div class="font-bold flex items-center gap-1.5 sm:gap-2 shrink-0">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full {{ 'bg-emerald-500 animate-pulse' if is_online else 'bg-rose-500' }}"></span>
            <div class="flex items-center gap-1.5">
                <span class="text-xs sm:text-sm font-extrabold text-white whitespace-nowrap">{{ client_name }}</span>
                <span class="hidden sm:inline text-[10px] text-sky-400 font-mono bg-sky-950 px-1.5 py-0.5 rounded border border-sky-800/40">{{ client_ip if client_ip else '' }}</span>
            </div>
        </div>

        <div class="flex items-center gap-1 sm:gap-2 shrink-0">
            <!-- 화면 크기 초기화 -->
            <button onclick="resetZoom()" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded font-semibold transition flex items-center gap-1 text-[11px]" title="화면 크기 맞춤">
                <i class="fa-solid fa-expand"></i> <span class="hidden sm:inline">화면맞춤</span>
            </button>

            {% if not is_server %}
            <!-- 🌟 피카 관리자 로그인 / 잠금 상태 슬라이딩 토글 (시안 A) -->
            <button id="pica-slider-btn" onclick="togglePicaSlider()" 
                class="relative h-8 sm:h-9 px-3 rounded-full flex items-center gap-2 cursor-pointer transition-all duration-300 select-none shadow-lg border active:scale-95 {% if is_pica_admin %}bg-emerald-950 border-emerald-500/80 shadow-[0_0_16px_rgba(16,185,129,0.35)] flex-row-reverse{% else %}bg-slate-900 border-amber-500/60 shadow-[0_0_12px_rgba(245,158,11,0.2)]{% endif %}" 
                title="클릭하여 관리자 로그인 및 잠금 상태 전환">
                <!-- 슬라이딩 인디케이터 핸들 -->
                <div id="pica-slider-knob" class="w-5 h-5 sm:w-6 sm:h-6 rounded-full {% if is_pica_admin %}bg-emerald-400{% else %}bg-amber-500{% endif %} shadow-md flex items-center justify-center text-slate-950 transition-all duration-300">
                    <i id="pica-slider-icon" class="fa-solid {% if is_pica_admin %}fa-unlock-keyhole{% else %}fa-lock{% endif %} text-[9px] sm:text-[10px]"></i>
                </div>
                <!-- 상태 텍스트 -->
                <span id="pica-slider-label" class="text-[11px] sm:text-xs font-extrabold {% if is_pica_admin %}text-emerald-300 flex items-center gap-1.5{% else %}text-amber-300{% endif %} tracking-tight transition-all duration-300">
                    {% if is_pica_admin %}
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> 관리자 접속중
                    {% else %}
                    잠김 상태
                    {% endif %}
                </span>
            </button>
            {% else %}
            <!-- 서버 PC 전용 뱃지 -->
            <span class="px-2 py-1 bg-indigo-950 text-indigo-300 border border-indigo-700/50 rounded text-[11px] font-bold flex items-center gap-1" title="관리 서버 (잠금해제 불필요)">
                <i class="fa-solid fa-server"></i> 서버
            </span>
            {% endif %}

            <!-- 닫기 -->
            <button onclick="window.close()" class="px-2.5 sm:px-3 py-1.5 bg-rose-800 hover:bg-rose-700 rounded font-semibold transition">
                닫기
            </button>
        </div>
    </div>

    <!-- 메인 터치/화면 컨테이너 -->
    <div id="touch-container" class="flex-1 relative bg-black overflow-hidden w-full max-w-full h-full min-w-0 touch-none select-none">
        
        <!-- 로딩 / 오프라인 인디케이터 -->
        <div id="loading-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/95 text-slate-300 gap-3 z-30">
            {% if not is_online %}
            <div class="w-12 h-12 rounded-full bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 text-2xl">
                <i class="fa-solid fa-power-off"></i>
            </div>
            <p class="text-base font-bold text-white">{{ client_name }} PC가 오프라인 상태입니다</p>
            <p class="text-xs text-slate-400 max-w-sm text-center">PC에서 ZeusClientAgent가 구동 중인지 확인해주세요.</p>
            <button onclick="location.reload()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-bold text-white transition">
                다시 연결 시도
            </button>
            {% else %}
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500"></i>
            <p class="text-sm font-bold text-white">{{ client_name }} ({{ client_ip }}) 화면을 불러오는 중...</p>
            {% endif %}
        </div>

        <!-- 줌/팬 적용 대상 래퍼 (1:1 정밀 좌표 표준 동기화) -->
        <div id="viewport-wrapper">
            <img id="stream-img" src="" alt="Remote Desktop" class="opacity-0 transition-opacity">
        </div>
    </div>

    <script>
        const clientId = "{{ client_id }}";
        const actualClientId = "{{ actual_client_id }}" || clientId;
        const targetId = actualClientId;
        
        const container = document.getElementById('touch-container');
        const wrapper = document.getElementById('viewport-wrapper');
        const img = document.getElementById('stream-img');
        const overlay = document.getElementById('loading-overlay');
        const statusDot = document.getElementById('status-dot');

        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let ws = null;
        let wsReconnectTimer = null;
        let wsPingTimer = null;

        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }
            try {
                ws = new WebSocket(`${wsProtocol}//${location.host}/ws/remote_view/${targetId}`);
            } catch (err) {
                scheduleReconnect();
                return;
            }

            ws.onopen = () => {
                console.log('[Remote] Connected');
                if (statusDot) statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
                if (wsPingTimer) clearInterval(wsPingTimer);
                wsPingTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ event: 'PING' }));
                    }
                }, 5000);
            };

            ws.onmessage = (e) => {
                if (!firstFrameReceived) {
                    firstFrameReceived = true;
                    if (overlay) overlay.style.display = 'none';
                    img.classList.remove('opacity-0');
                }
                try {
                    let frameData = "";
                    if (e.data.startsWith('{')) {
                        const parsed = JSON.parse(e.data);
                        if (parsed.event === 'PONG') return;
                        frameData = parsed.frame || parsed.image || "";
                    } else {
                        frameData = e.data;
                    }
                    if (!frameData) return;

                    const fullSrc = "data:image/jpeg;base64," + frameData;
                    if (!isRendering) {
                        isRendering = true;
                        img.src = fullSrc;
                    } else {
                        // 🌟 이전 프레임 디코딩 중일 때는 최신 프레임만 대기열에 저장 (화면 프리징 및 메모리 폭주 100% 방지)
                        pendingFrameSrc = fullSrc;
                    }
                } catch (err) {}
            };

            ws.onerror = (err) => {
                console.warn('[Remote WS Error]', err);
                if (statusDot) statusDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
            };

            ws.onclose = () => {
                console.log('[Remote WS Closed] 1초 후 자동 재연결...');
                if (statusDot) statusDot.className = 'w-2.5 h-2.5 rounded-full bg-slate-600';
                if (wsPingTimer) clearInterval(wsPingTimer);
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
            wsReconnectTimer = setTimeout(() => {
                connectWebSocket();
            }, 1000);
        }

        connectWebSocket();

        let firstFrameReceived = false;
        let imgNaturalW = 1920;
        let imgNaturalH = 1080;

        let scale = 1.0;
        let panX = 0;
        let panY = 0;
        let baseScale = 1.0;

        function updateTransform() {
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function fitToContainer() {
            if (!imgNaturalW || !imgNaturalH) return;
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            if (cw === 0 || ch === 0) return;

            const scaleX = cw / imgNaturalW;
            const scaleY = ch / imgNaturalH;
            baseScale = Math.min(scaleX, scaleY);
            scale = baseScale;

            const renderedW = imgNaturalW * baseScale;
            const renderedH = imgNaturalH * baseScale;
            panX = (cw - renderedW) / 2;
            panY = (ch - renderedH) / 2;

            wrapper.style.width = `${imgNaturalW}px`;
            wrapper.style.height = `${imgNaturalH}px`;

            updateTransform();
        }

        window.resetZoom = fitToContainer;
        window.addEventListener('resize', fitToContainer);

        let isRendering = false;
        let pendingFrameSrc = null;

        img.onload = () => {
            isRendering = false;
            if (img.naturalWidth && (imgNaturalW !== img.naturalWidth || imgNaturalH !== img.naturalHeight)) {
                imgNaturalW = img.naturalWidth;
                imgNaturalH = img.naturalHeight;
                fitToContainer();
            }
            if (pendingFrameSrc) {
                const nextSrc = pendingFrameSrc;
                pendingFrameSrc = null;
                isRendering = true;
                img.src = nextSrc;
            }
        };

        img.onerror = () => {
            isRendering = false;
        };

        function sendEvent(type, xRatio, yRatio, extra = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ event: type, x: xRatio, y: yRatio, ...extra }));
            }
        }

        // 🌟 표준 1:1 정밀 좌표 공식 (모바일 상단바/뷰포트 오프셋 완벽 감산)
        function screenToImageRatio(clientX, clientY) {
            const cRect = container.getBoundingClientRect();
            const relX = clientX - cRect.left;
            const relY = clientY - cRect.top;

            const imgX = (relX - panX) / scale;
            const imgY = (relY - panY) / scale;

            if (imgX >= 0 && imgX <= imgNaturalW && imgY >= 0 && imgY <= imgNaturalH) {
                const xRatio = Math.max(0, Math.min(1, imgX / imgNaturalW));
                const yRatio = Math.max(0, Math.min(1, imgY / imgNaturalH));
                return { x: xRatio, y: yRatio, imgX, imgY, valid: true };
            }
            return { valid: false, imgX, imgY };
        }

        // 🌟 화면 터치 즉시 어디든 보이는 명확한 파란색(우클릭은 황금주황색) 터치 피드백 마커
        function showHitMarker(clientX, clientY, isRight = false) {
            const cRect = container.getBoundingClientRect();
            const relX = clientX - cRect.left;
            const relY = clientY - cRect.top;

            const marker = document.createElement('div');
            marker.className = 'touch-hit-marker' + (isRight ? ' right-click' : '');
            marker.style.left = `${relX}px`;
            marker.style.top = `${relY}px`;
            container.appendChild(marker);
            setTimeout(() => marker.remove(), 1000);
        }

        // --- 터치 및 마우스 조작 인터랙션 ---
        let isTouching = false;
        let isPinching = false;
        let hasPinched = false;
        let lastPinchEndTime = 0;
        let startX = 0, startY = 0;
        let startPanX = 0, startPanY = 0;
        let initialPinchDist = 0;
        let pinchCenterImgX = 0;
        let pinchCenterImgY = 0;
        let touchStartTime = 0;
        let movedSignificantly = false;
        let lastTouchEndTime = 0;

        // 🌟 롱프레스 우클릭 & 길게 눌러 드래그 상태 관리
        let longPressTimer = null;
        let isLongPressActive = false; // 0.5초 꾹 눌러서 활성화되었는가?
        let hasDragged = false; // 롱프레스 활성화 후 드래그 이동을 했는가?
        let lastActionEndTime = 0; // 후속 가상 클릭 방어 쿨다운

        function cancelLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        container.addEventListener('touchstart', (e) => {
            if (e.touches.length >= 2) {
                cancelLongPress();
                if (isLongPressActive && hasDragged) {
                    // 드래그 도중 두 번째 손가락이 닿으면 안전하게 마우스 업
                    const pos = screenToImageRatio(startX, startY);
                    if (pos.valid) sendEvent('MOUSE_UP', pos.x, pos.y, { button: 'left' });
                }
                isLongPressActive = false;
                hasDragged = false;

                // ✌ 두 손가락 이상 터치 감지 즉시 단일 터치/클릭 상태 완벽 무효화
                isTouching = false;
                isPinching = true;
                hasPinched = true;
                movedSignificantly = true;
                lastPinchEndTime = Date.now();

                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );

                const cRect = container.getBoundingClientRect();
                const midClientX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midClientY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const relX = midClientX - cRect.left;
                const relY = midClientY - cRect.top;

                pinchCenterImgX = (relX - panX) / scale;
                pinchCenterImgY = (relY - panY) / scale;

                e.preventDefault();
                return;
            }

            if (e.touches.length === 1) {
                cancelLongPress();
                isLongPressActive = false;
                hasDragged = false;

                // 핀치 줌 또는 최근 액션 직후 쿨다운(400ms)이면 방어
                if (Date.now() - lastPinchEndTime < 400 || Date.now() - lastActionEndTime < 500 || hasPinched) {
                    isTouching = false;
                    return;
                }

                isTouching = true;
                movedSignificantly = false;
                touchStartTime = Date.now();
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startPanX = panX;
                startPanY = panY;

                // 🌟 0.5초 가만히 꾹 누르고 있으면 롱프레스 모드 활성화 (진동 + 대기)
                const targetClientX = startX;
                const targetClientY = startY;
                longPressTimer = setTimeout(() => {
                    if (isTouching && !movedSignificantly && !hasPinched && !isPinching) {
                        isLongPressActive = true;
                        hasDragged = false;

                        // 스마트폰 햅틱 진동 피드백 (징-)
                        if (navigator.vibrate) {
                            try { navigator.vibrate(60); } catch(err) {}
                        }
                        showHitMarker(targetClientX, targetClientY, true); // 황금주황색 마커
                    }
                }, 500);
            }
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            if (e.touches.length >= 2) {
                cancelLongPress();
                e.preventDefault();
                isPinching = true;
                hasPinched = true;
                isTouching = false;
                movedSignificantly = true;
                lastPinchEndTime = Date.now();

                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (initialPinchDist > 0) {
                    const factor = dist / initialPinchDist;
                    initialPinchDist = dist;

                    const newScale = Math.min(Math.max(baseScale * 0.8, scale * factor), baseScale * 6.0);

                    const cRect = container.getBoundingClientRect();
                    const midClientX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midClientY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const relX = midClientX - cRect.left;
                    const relY = midClientY - cRect.top;

                    panX = relX - pinchCenterImgX * newScale;
                    panY = relY - pinchCenterImgY * newScale;
                    scale = newScale;

                    pinchCenterImgX = (relX - panX) / scale;
                    pinchCenterImgY = (relY - panY) / scale;

                    updateTransform();
                }
            } else if (e.touches.length === 1 && isTouching && !hasPinched && !isPinching) {
                if (Date.now() - lastPinchEndTime < 400) return;

                const curClientX = e.touches[0].clientX;
                const curClientY = e.touches[0].clientY;
                const dx = curClientX - startX;
                const dy = curClientY - startY;

                // 🌟 [핵심] 롱프레스가 활성화된 상태에서 움직이면 -> 마우스 좌클릭 드래그 실행!
                if (isLongPressActive) {
                    e.preventDefault();
                    if (!hasDragged) {
                        // 드래그 시작: 시작 위치로 MOUSE_DOWN 전송
                        hasDragged = true;
                        const startPos = screenToImageRatio(startX, startY);
                        if (startPos.valid) {
                            sendEvent('MOUSE_DOWN', startPos.x, startPos.y, { button: 'left' });
                        }
                    }
                    // 현재 위치로 MOUSE MOVE 전송 (창 끌기 / 파일 드래그)
                    const curPos = screenToImageRatio(curClientX, curClientY);
                    if (curPos.valid) {
                        sendEvent('MOVE', curPos.x, curPos.y);
                    }
                    return;
                }

                // 롱프레스 이전 25px 이상 이동 시 롱프레스 취소 (모바일 미세 떨림 감안 허용치 완화)
                const touchDist = Math.hypot(dx, dy);
                if (touchDist > 25) {
                    movedSignificantly = true;
                    cancelLongPress();
                }

                if (scale > baseScale * 1.05 && movedSignificantly) {
                    e.preventDefault();
                    panX = startPanX + dx;
                    panY = startPanY + dy;
                    updateTransform();
                } else if (!movedSignificantly) {
                    const pos = screenToImageRatio(curClientX, curClientY);
                    if (pos.valid) {
                        sendEvent('MOVE', pos.x, pos.y);
                    }
                }
            }
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            cancelLongPress();
            lastTouchEndTime = Date.now();

            // 핀치 줌 제스처 도중 손가락이 하나 먼저 떨어진 경우 처리
            if (isPinching || e.touches.length > 0) {
                if (e.touches.length < 2) {
                    isPinching = false;
                    lastPinchEndTime = Date.now();
                }
                isTouching = false;
                movedSignificantly = true;
                e.preventDefault();
            }

            // 모든 손가락이 화면에서 떨어졌을 때
            if (e.touches.length === 0) {
                const touchDuration = Date.now() - touchStartTime;
                const pinchCooldown = Date.now() - lastPinchEndTime;

                // 🌟 1) 롱프레스 후 손가락을 뗐을 때 처리
                if (isLongPressActive) {
                    lastActionEndTime = Date.now();
                    const lastTouch = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
                    const finalX = lastTouch ? lastTouch.clientX : startX;
                    const finalY = lastTouch ? lastTouch.clientY : startY;
                    const pos = screenToImageRatio(finalX, finalY);

                    if (hasDragged) {
                        // 🖱️ Case A: 드래그를 하다가 손가락을 뗌 -> 드래그 완료 (MOUSE_UP)
                        if (pos.valid) {
                            sendEvent('MOUSE_UP', pos.x, pos.y, { button: 'left' });
                        }
                    } else {
                        // 🖱️ Case B: 0.5초 꾹 누르고 있다가 그 자리에서 손가락을 뗌 -> 우클릭 (RIGHT CLICK)!
                        showHitMarker(startX, startY, true); // 황금주황색 마커
                        const origPos = screenToImageRatio(startX, startY);
                        if (origPos.valid) {
                            sendEvent('CLICK', origPos.x, origPos.y, { button: 'right' });
                        }
                    }

                    isLongPressActive = false;
                    hasDragged = false;
                    isTouching = false;
                    movedSignificantly = false;
                    e.preventDefault();
                    return;
                }

                // 🌟 2) 순수 단일 탭 좌클릭 (0.6초 미만 짧은 탭, 총 이동 거리 25px 이내)
                const lastTouch = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
                const dist = lastTouch ? Math.hypot(lastTouch.clientX - startX, lastTouch.clientY - startY) : 999;

                if (!hasPinched && !isPinching && pinchCooldown >= 250 && touchDuration < 600 && dist <= 25 && lastTouch) {
                    const clientX = lastTouch.clientX;
                    const clientY = lastTouch.clientY;
                    showHitMarker(clientX, clientY, false); // 하늘색 좌클릭 마커 즉시 표출

                    const pos = screenToImageRatio(clientX, clientY);
                    if (pos.valid) {
                        sendEvent('CLICK', pos.x, pos.y, { button: 'left' });
                    }
                    e.preventDefault();
                }

                // 전체 터치 세션 종료 시 플래그 리셋
                isTouching = false;
                isPinching = false;
                hasPinched = false;
                movedSignificantly = false;
                isLongPressActive = false;
                hasDragged = false;
            }
        });

        container.addEventListener('touchcancel', () => {
            cancelLongPress();
            if (isLongPressActive && hasDragged) {
                const pos = screenToImageRatio(startX, startY);
                if (pos.valid) sendEvent('MOUSE_UP', pos.x, pos.y, { button: 'left' });
            }
            isTouching = false;
            isPinching = false;
            hasPinched = false;
            movedSignificantly = false;
            isLongPressActive = false;
            hasDragged = false;
            lastPinchEndTime = Date.now();
            lastTouchEndTime = Date.now();
            lastActionEndTime = Date.now();
        });

        // 데스크톱 마우스 우클릭 (브라우저 메뉴 대신 원격 PC 우클릭 전달)
        container.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (e.pointerType === 'touch' || Date.now() - lastActionEndTime < 800) {
                return;
            }
            const pos = screenToImageRatio(e.clientX, e.clientY);
            if (pos.valid) {
                lastActionEndTime = Date.now();
                showHitMarker(pos.imgX, pos.imgY, true);
                sendEvent('CLICK', pos.x, pos.y, { button: 'right' });
            }
        });

        // 데스크톱 마우스 클릭 지원 (터치 후 가상 마우스 클릭 및 핀치 후 합성 클릭 완벽 차단)
        container.addEventListener('click', (e) => {
            if (e.ctrlKey) return;
            if (e.pointerType === 'touch') return;
            if (Date.now() - lastTouchEndTime < 800 || Date.now() - lastPinchEndTime < 800 || Date.now() - lastActionEndTime < 800) {
                return;
            }

            const pos = screenToImageRatio(e.clientX, e.clientY);
            if (pos.valid) {
                showHitMarker(pos.imgX, pos.imgY);
                sendEvent('CLICK', pos.x, pos.y, { button: 'left' });
            }
        });

        // 데스크톱 마우스 휠 줌 (커서 위치를 중심으로 확대/축소)
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.ctrlKey) {
                const factor = e.deltaY < 0 ? 1.15 : 0.85;
                const newScale = Math.min(Math.max(baseScale * 0.8, scale * factor), baseScale * 6.0);

                const cRect = container.getBoundingClientRect();
                const relX = e.clientX - cRect.left;
                const relY = e.clientY - cRect.top;

                const cursorImgX = (relX - panX) / scale;
                const cursorImgY = (relY - panY) / scale;

                panX = relX - cursorImgX * newScale;
                panY = relY - cursorImgY * newScale;
                scale = newScale;

                updateTransform();
            } else {
                const delta = e.deltaY < 0 ? 120 : -120;
                sendEvent('WHEEL', 0, 0, { delta: delta });
            }
        }, { passive: false });

        // ── 🌟 피카 관리자 로그인 / 잠금 상태 슬라이딩 토글 로직 (시안 A) ──
        let isPicaAdmin = {{ 'true' if is_pica_admin else 'false' }};
        let isPicaSwitching = false;

        // 모바일 하단 플로팅 토스트 알림
        function showToast(message, isError = false) {
            let toast = document.getElementById('remote-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'remote-toast';
                toast.className = 'fixed bottom-14 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold z-50 flex items-center gap-2 transition-all duration-300 pointer-events-none opacity-0';
                document.body.appendChild(toast);
            }
            toast.className = `fixed bottom-14 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold z-50 flex items-center gap-2 transition-all duration-300 pointer-events-none opacity-100 ${
                isError 
                    ? 'bg-rose-950/95 text-rose-200 border border-rose-500/80 shadow-[0_0_20px_rgba(244,63,94,0.4)]' 
                    : 'bg-emerald-950/95 text-emerald-200 border border-emerald-500/80 shadow-[0_0_20px_rgba(16,185,129,0.4)]'
            }`;
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-check text-emerald-400'}"></i> <span>${message}</span>`;
            
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.className = toast.className.replace('opacity-100', 'opacity-0');
            }, 3000);
        }

        function updateSliderUI(isAdmin, isLoading = false) {
            const btn = document.getElementById('pica-slider-btn');
            const knob = document.getElementById('pica-slider-knob');
            const icon = document.getElementById('pica-slider-icon');
            const label = document.getElementById('pica-slider-label');
            if (!btn || !knob || !icon || !label) return;

            if (isLoading) {
                // 전환 처리 중 로딩 상태
                btn.className = "relative h-8 sm:h-9 px-3 rounded-full flex items-center gap-2 cursor-wait select-none shadow-lg border opacity-90 bg-indigo-950 border-indigo-500/80 shadow-[0_0_16px_rgba(99,102,241,0.35)]";
                knob.className = "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-indigo-500 shadow-md flex items-center justify-center text-white transition-all duration-300";
                icon.className = "fa-solid fa-circle-notch fa-spin text-[10px]";
                label.className = "text-[11px] sm:text-xs font-extrabold text-indigo-300 tracking-tight transition-all duration-300";
                label.innerHTML = '전환 처리 중...';
                return;
            }

            if (isAdmin) {
                // 관리자 접속중 (우측 슬라이딩, 에메랄드 네온)
                btn.className = "relative h-8 sm:h-9 px-3 rounded-full flex items-center gap-2 cursor-pointer transition-all duration-300 select-none shadow-lg border active:scale-95 bg-emerald-950 border-emerald-500/80 shadow-[0_0_16px_rgba(16,185,129,0.35)] flex-row-reverse";
                knob.className = "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-emerald-400 shadow-md flex items-center justify-center text-slate-950 transition-all duration-300";
                icon.className = "fa-solid fa-unlock-keyhole text-[9px] sm:text-[10px]";
                label.className = "text-[11px] sm:text-xs font-extrabold text-emerald-300 tracking-tight transition-all duration-300 flex items-center gap-1.5";
                label.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> 관리자 접속중';
            } else {
                // 잠김 상태 (좌측 슬라이딩, 앰버 골드)
                btn.className = "relative h-8 sm:h-9 px-3 rounded-full flex items-center gap-2 cursor-pointer transition-all duration-300 select-none shadow-lg border active:scale-95 bg-slate-900 border-amber-500/60 shadow-[0_0_12px_rgba(245,158,11,0.2)]";
                knob.className = "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-amber-500 shadow-md flex items-center justify-center text-slate-950 transition-all duration-300";
                icon.className = "fa-solid fa-lock text-[9px] sm:text-[10px]";
                label.className = "text-[11px] sm:text-xs font-extrabold text-amber-300 tracking-tight transition-all duration-300";
                label.innerHTML = '잠김 상태';
            }
        }

        async function syncPicaState() {
            if (isPicaSwitching) return;
            try {
                const res = await fetch(`/api/pica/seat_state/${targetId}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.status === 'ok' && data.is_admin !== undefined) {
                        if (isPicaAdmin !== data.is_admin) {
                            console.log(`[PICA SYNC] 서버 실시간 상태 변경 감지: ${isPicaAdmin} -> ${data.is_admin}`);
                            isPicaAdmin = data.is_admin;
                            updateSliderUI(isPicaAdmin, false);
                        }
                    }
                }
            } catch(e) {}
        }
        setInterval(syncPicaState, 2000);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) syncPicaState();
        });
        window.addEventListener('focus', syncPicaState);

        window.togglePicaSlider = async function() {
            if (isPicaSwitching) return;
            isPicaSwitching = true;

            const nextStateIsAdmin = !isPicaAdmin;
            const action = nextStateIsAdmin ? 'UNLOCK_PICA' : 'LOCK_PICA';
            
            // 🌟 1) 즉시 로딩 스피너 및 '전환 처리 중...' 시각 피드백 제공!
            updateSliderUI(nextStateIsAdmin, true);

            try {
                const res = await fetch(`/api/command/${targetId}/${action}`, { method: 'POST' });
                const data = await res.json();
                console.log(`[PICA TOGGLE] ${action} 응답:`, data);
                if (data.status === 'ok') {
                    isPicaAdmin = nextStateIsAdmin;
                    updateSliderUI(isPicaAdmin, false);
                    showToast(nextStateIsAdmin ? '🔑 관리자 로그인 성공' : '🔒 좌석 잠금 복구 완료', false);
                } else {
                    console.warn(`[PICA TOGGLE] 명령 실패:`, data);
                    // 실패 시 원래 상태로 슬라이드 롤백
                    updateSliderUI(isPicaAdmin, false);
                    showToast(`요청 실패: ${data.message || '좌석 상태 확인 필요'}`, true);
                }
            } catch (err) {
                console.error(`[PICA TOGGLE] 네트워크 오류:`, err);
                updateSliderUI(isPicaAdmin, false);
                showToast(`네트워크 오류: ${err.message}`, true);
            } finally {
                isPicaSwitching = false;
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateSliderUI(isPicaAdmin);
            setTimeout(fitToContainer, 50);
        });
    </script>
</body>
</html>
